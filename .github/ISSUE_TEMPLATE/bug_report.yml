name: Bug report
description: Report a problem in Slovenian or English.
labels: [bug, "status: triage"]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, private correspondence or personal data. For vulnerabilities, follow SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened / Kaj se je zgodilo?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / Kaj bi se moralo zgoditi?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Koraki za ponovitev
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
