version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /apps/portal
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, "area: portal"]
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
