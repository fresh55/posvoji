# PR checks run entirely offline: lint, typecheck, fixture tests, policy
# validation and a static build. CI never crawls shelter websites.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/portal/uv.lock

      - run: pnpm install --frozen-lockfile

      - run: uv sync --directory apps/portal --frozen

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm validate:policies

      - name: Install Chromium for map visual tests
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Check map screenshots
        run: pnpm test:visual

      - run: pnpm --filter web build
