# PR checks run entirely offline: lint, typecheck, fixture tests, policy
# validation and a static build. CI never crawls shelter websites.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  # Supersede older PR runs, but give every main push its own group.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/portal/uv.lock

      - run: pnpm install --frozen-lockfile

      - run: uv sync --directory apps/portal --frozen

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm validate:policies

      - name: Install Chromium for map visual tests
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Check map screenshots
        run: pnpm test:visual

      - run: pnpm --filter web build
