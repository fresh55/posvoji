name: Production health

on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test notice to the configured alert recipient
        type: boolean
        default: false
  schedule:
    # The host checks every ten minutes. Hourly external checks bound private
    # repository runner use; GitHub scheduling is still best effort.
    - cron: "7 * * * *"

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  verify:
    # Explicit opt-in is independent of repository visibility.
    if: vars.POSVOJI_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Verify the public release and source freshness
        env:
          MONITOR_NETRC: ${{ secrets.POSVOJI_MONITOR_NETRC }}
          POSVOJI_MONITOR_MODEL_ENCODING: "1"
        shell: bash
        run: |
          set -euo pipefail
          netrc=$(mktemp)
          trap 'rm -f -- "$netrc"' EXIT
          if [[ -n "$MONITOR_NETRC" ]]; then
            printf '%s\n' "$MONITOR_NETRC" >"$netrc"
            chmod 600 "$netrc"
            export POSVOJI_MONITOR_NETRC_FILE="$netrc"
          fi
          unset MONITOR_NETRC
          bash scripts/monitor-production.sh
      - name: Send failure or requested test notice
        if: failure() || (github.event_name == 'workflow_dispatch' && inputs.test_alert)
        env:
          POSVOJI_ALERT_CONFIG: ${{ secrets.POSVOJI_ALERT_CONFIG }}
          TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
          CHECK_FAILED: ${{ job.status == 'failure' }}
        run: |
          unit=posvoji-health.service
          if [[ "$TEST_ALERT" == true && "$CHECK_FAILED" != true ]]; then unit=posvoji-alert-test.service; fi
          python3 scripts/notify-failure.py "$unit" --github-actions
