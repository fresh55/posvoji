# Which shelter serves which Slovenian municipality (občina).
#
# GENERATED at first authoring, maintained by hand from here on.
# Municipality list: all 212 občin (GURS/SURS naming, spaced hyphens).
# Every coverage entry cites a source below. Municipalities with an
# empty coverage list have NO verified public assignment: the page
# must show 'no verified data', never a guess.
#
# Conflicts resolved toward the newer source on purpose:
# - Bloke, Loška dolina: Meli (2023) -> Ljubljana (own site, 2026).
# - Laško: Zonzani (2018) -> Sevnica (2023).
# - Poljčane, Slovenska Bistrica, Slovenske Konjice, Zreče: Zonzani
#   (2018) -> Maribor (own site, 2026).

meta:
  municipality_list_source: "GURS/SURS — 212 občin"
  last_reviewed: 2026-08-20

