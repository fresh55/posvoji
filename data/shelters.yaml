# Registry of Slovenian animal shelters.
#
# Source: UVHVVR register of shelters (gov.si), version dated 2026-02-23,
# supplemented with public website checks from August 2026. Contacts listed
# here are institutional only, never personal data of private individuals.
#
# This file is reference data for humans and for future providers. An entry
# here does NOT mean the shelter may be crawled: that is decided solely by a
# granted permission recorded in providers/<id>/policy.yaml.

meta:
  register_source: "UVHVVR — Register zavetišč (gov.si)"
  register_date: 2026-02-23
  last_reviewed: 2026-08-20
  # hours and onCallPhone: read off each shelter's own website on the date
  # below. Free text, kept in the shelter's own words and shortened; a
  # shelter with no website, or none published, has neither field.
  hours_checked: 2026-09-06

