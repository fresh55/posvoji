# The project owner confirmed Horjul's permission on 2026-08-18, covering the
# shelter catalogue, the animal photographs and the descriptions. The parser
# does not extract descriptions yet, so none are ingested until it does; the
# policy records the grant, not the implementation.
providerId: horjul
source: https://www.zavetisce-horjul.net/iscejo-dom/
enabled: true

ingestion: scrape
images: cache-permitted
descriptions: full-permitted

permission:
  status: granted
  date: 2026-08-18
  reference: project-owner-confirmation-horjul-2026-08-18
  notes: >-
    Project owner confirmed permission for structured shelter facts, for
    displaying and caching shelter-hosted animal photographs, and for the full
    descriptions.

allowedFields:
  - name
  - species
  - sex
  - approximateAgeMonths
  - size
  - status
  - intakeDate
  - originMunicipality
  - medical
  - images
  - shortDescription

attribution: "Vir: Zavetišče Horjul"

crawl:
  intervalHours: 12
  excludePaths:
    - /privat-oddaja/
    - /oddajo-lastniki/
