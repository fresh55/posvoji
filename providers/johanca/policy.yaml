# Machine-readable permission record. CI validates every policy.yaml against
# the ProviderPolicy schema: a provider cannot be enabled, show images or carry
# more than bare facts without granted, dated permission from the shelter.
#
# This one records a logo grant and nothing else. The shelter publishes no
# animal list we ingest, so enabled stays false and no adapter is registered
# for it: the crawl skips it entirely and only the logo sync reads this file.
providerId: johanca
# The shelter is run and financed by Veterinarska ambulanta Tolmin and has no
# separate site; the practice's site carries the Zavetišče JoHanca section.
source: https://www.veterina-tolmin.si/
enabled: false

ingestion: manual
images: none
descriptions: facts-only

logo:
  use: permitted
  # The shelter's own mark, not the practice's: the dog asleep on a red
  # armchair with a cat behind it, over the two-line "Zavetišče JoHanca"
  # wordmark. A JPEG on flat white, which the site draws as a plate of its own.
  #
  # Deliberately not the Facebook cover banner of the same artwork. That one
  # is larger, but it carries the practice's address and phone number burnt
  # into the image and a wordmark bleeding off its right edge, none of which
  # survives being drawn at the size a card gives it.
  url: https://www.veterina-tolmin.si/wp-content/uploads/2013/12/johanca.jpg
  date: 2026-08-30
  reference: project-owner-confirmation-logos-2026-08-30

permission:
  status: none
  notes: >-
    No animal-catalogue permission is recorded. The independently dated logo
    grant above covers the mark only; no animal data is taken from this shelter.

attribution: "Vir: Zavetišče JoHanca"

crawl:
  intervalHours: 12
  excludePaths: []
