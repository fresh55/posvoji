# Machine-readable permission record. CI validates every policy.yaml against
# the ProviderPolicy schema: a provider cannot be enabled, show images or carry
# more than bare facts without granted, dated permission from the shelter.
#
# This shelter publishes no animal list we can crawl. It writes its animals
# straight into our portal instead, so ingestion stays manual, no adapter is
# registered for it and the crawl loop skips it; the listings feed is where
# its animals come from and the removal guard, the image cache and the crawled
# snapshot treat them like any other crawled record. See
# docs/MANUAL-LISTINGS.md.
providerId: johanca
# The shelter is run and financed by Veterinarska ambulanta Tolmin and has no
# separate site; the practice's site carries the Zavetišče JoHanca section.
source: https://www.veterina-tolmin.si/
enabled: true

ingestion: manual
images: cache-permitted
descriptions: full-permitted

logo:
  use: permitted
  # The shelter's own mark, not the practice's: the dog asleep on a red
  # armchair with a cat behind it, over the two-line "Zavetišče JoHanca"
  # wordmark. A JPEG on flat white, which the site draws as a plate of its own.
  #
  # Deliberately not the Facebook cover banner of the same artwork. That one
  # is larger, but it carries the practice's address and phone number burnt
  # into the image and a wordmark bleeding off its right edge, none of which
  # survives being drawn at the size a card gives it.
  url: https://www.veterina-tolmin.si/wp-content/uploads/2013/12/johanca.jpg
  date: 2026-08-30
  reference: project-owner-confirmation-logos-2026-08-30

permission:
  status: granted
  date: 2026-09-01
  reference: project-owner-confirmation-portal-listings-2026-09-01
  notes: >-
    The shelter lists its animals directly through the portal on Posvoji.si.
    Typing a listing in is publishing it, which is a stronger grant than a
    crawl permission: the photos are uploaded by the shelter for us to show,
    so they may be cached, and the text is written for this site, so
    descriptions carry in full. The project owner confirmed the listing
    permission on 2026-09-01; data/shelters.yaml records the shelter's own
    earlier confirmation of 2026-08-20, which is what this builds on.

    DATA-POLICY.md principle 3 asks every animal to link to the listing it
    came from. For a manual listing the original is the listing on Posvoji.si
    itself, so source.sourceUrl is the shelter's own page on this site rather
    than a page on the source above.

attribution: "Vir: Zavetišče JoHanca"

crawl:
  intervalHours: 12
  excludePaths: []
