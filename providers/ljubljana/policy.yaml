# The project owner confirmed permission on 2026-08-18 for the shelter
# catalogue, the shelter-hosted animal photographs and the descriptions. The
# parser extracts the "Opis" paragraph and any prose paragraphs the shelter
# tacks on after it (or, when there is no "Opis" paragraph, the prose on its
# own) from the CMS description field and ships it as shortDescription; the
# other labelled facts beside it (birth date, weight) are not restated as
# prose.
providerId: ljubljana
source: https://www.zavetisce-ljubljana.si/posvoji-zival/v-zavetiscu
enabled: true

ingestion: scrape
images: cache-permitted
descriptions: full-permitted

logo:
  use: permitted
  url: https://www.zavetisce-ljubljana.si/assets/logo-new.svg
  date: 2026-08-20
  reference: project-owner-confirmation-logos-2026-08-20

permission:
  status: granted
  date: 2026-08-18
  reference: project-owner-confirmation-ljubljana-2026-08-18
  notes: >-
    Project owner confirmed permission for structured shelter facts, for
    displaying and caching shelter-hosted animal photographs, and for the full
    descriptions.

allowedFields:
  - name
  - species
  - sex
  - breed
  - birthDate
  - size
  - status
  - intakeDate
  - medical
  - images
  - shortDescription
  # Reviewed facts from the already-permitted descriptions and photographs.
  - approximateAgeMonths
  - lifeStage
  - foundDate
  - originMunicipality
  - energy
  - goodWith
  - apartmentOk
  - specialNeeds
  - adoptionRequirements
  - coatColor
  - coatColors
  - coatLength

attribution: "Vir: Zavetišče Ljubljana"

crawl:
  intervalHours: 12
  allowPaths:
    - /posvoji-zival/v-zavetiscu
    - /zivali/
  excludePaths:
    - /posvoji-zival/oddajo-lastniki
    - /posvoji-zival/postopek-posvojitve-od-lastnika
