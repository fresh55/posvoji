# The project owner confirmed permission on 2026-08-18 for the shelter
# catalogue and shelter-hosted animal photographs. Keep editorial descriptions
# out of the initial scope and link to, rather than cache, the photographs.
providerId: ljubljana
source: https://www.zavetisce-ljubljana.si/posvoji-zival/v-zavetiscu
enabled: true

ingestion: scrape
images: remote
descriptions: facts-only

logo:
  use: permitted
  url: https://www.zavetisce-ljubljana.si/assets/logo-new.svg
  date: 2026-08-20
  reference: project-owner-confirmation-logos-2026-08-20

permission:
  status: granted
  date: 2026-08-18
  reference: project-owner-confirmation-ljubljana-2026-08-18
  notes: >-
    Project owner confirmed permission for structured shelter facts and display
    of shelter-hosted animal photographs. Descriptions and image caching remain
    outside the initial scope.

allowedFields:
  - name
  - species
  - sex
  - breed
  - birthDate
  - size
  - status
  - intakeDate
  - medical
  - images

attribution: "Vir: Zavetišče Ljubljana"

crawl:
  intervalHours: 12
  excludePaths:
    - /posvoji-zival/oddajo-lastniki
    - /posvoji-zival/postopek-posvojitve-od-lastnika
