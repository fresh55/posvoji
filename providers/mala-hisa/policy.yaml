# The project owner confirmed Mala hiša's permission on 2026-08-20, covering
# the shelter catalogue, the animal photographs and the descriptions. The
# "Privat oddaja" section carries private-owner listings and stays excluded
# from the crawl for good.
providerId: mala-hisa
source: https://zavetisce-malahisa.si/psi-za-oddajo/
enabled: true

ingestion: scrape
images: cache-permitted
descriptions: full-permitted

logo:
  use: permitted
  url: https://zavetisce-malahisa.si/wp-content/uploads/2025/02/mala-hisa-logo-white-1.png
  date: 2026-08-20
  reference: project-owner-confirmation-logos-2026-08-20

permission:
  status: granted
  date: 2026-08-20
  reference: project-owner-confirmation-mala-hisa-2026-08-20
  notes: >-
    Project owner confirmed permission for structured shelter facts, for
    displaying and caching shelter-hosted animal photographs, and for the
    full descriptions.

allowedFields:
  - name
  - species
  - sex
  - breed
  - approximateAgeMonths
  - size
  - status
  - images
  - shortDescription

attribution: "Vir: Zavetišče Mala hiša"

crawl:
  intervalHours: 12
  excludePaths:
    - /privat-oddaja/
    - /najdeni-psi/
    - /wp-admin/
