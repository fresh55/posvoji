# Machine-readable record of the shelter's permission for structured facts,
# full animal descriptions, and display plus caching of animal photographs.
providerId: maribor
source: https://zavetisce-mb.si/posvoji-me/
enabled: true

ingestion: scrape
images: cache-permitted
descriptions: full-permitted

logo:
  use: permitted
  # The colour lockup rather than the white knockout the dark header uses.
  # Same swan emblem and SKUPINA JHMB wordmark; drawn in its own colours it
  # reads on the card without the dark chip white ink has to have, and its
  # viewBox is 175x57 against the white file's 85x40.
  url: https://zavetisce-mb.si/wp-content/uploads/2024/02/skupina-jhmb-logo-lezec.svg
  date: 2026-08-20
  reference: project-owner-confirmation-logos-2026-08-20

permission:
  status: granted
  date: 2026-08-19
  reference: mail-thread-maribor-2026-08-19
  notes: >-
    Pisno dovoljenje: zajem kataloga živali, prikaz in predpomnjenje
    fotografij ter celotni opisi živali.

allowedFields:
  - name
  - species
  - sex
  - breed
  - approximateAgeMonths
  - size
  - status
  - intakeDate
  - medical
  - images
  - shortDescription

attribution: "Vir: Zavetišče Maribor (Snaga)"

crawl:
  intervalHours: 12
  excludePaths:
    - /wp-admin/
    - /najdeni-pogresani/
    - /privat-oddaja/
    - /oddajo-lastniki/
