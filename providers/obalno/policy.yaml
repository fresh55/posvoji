# Machine-readable record of the shelter's permission for structured facts,
# full animal descriptions, and display plus caching of animal photographs.
providerId: obalno
source: https://obalnozavetisce.si/iscejo-nov-dom/psi/
enabled: true

ingestion: scrape
images: cache-permitted
descriptions: full-permitted

permission:
  status: granted
  date: 2026-08-18
  reference: mail-thread-obalno-2026-08-18
  notes: >-
    Pisno dovoljenje: zajem kataloga psov in mačk, prikaz in predpomnjenje
    fotografij ter celotni opisi živali.

allowedFields:
  - name
  - species
  - sex
  - birthDate
  - intakeDate
  - status
  - images
  - shortDescription

attribution: "Vir: Obalno zavetišče (Marjetica Koper)"

crawl:
  intervalHours: 12
  excludePaths:
    - /wp-admin/
    - /privat-oddaja/
    - /oddajo-lastniki/
