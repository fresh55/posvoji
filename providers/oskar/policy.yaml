# Machine-readable permission record. CI validates every policy.yaml against
# the ProviderPolicy schema: a provider cannot be enabled, show images or carry
# more than bare facts without granted, dated permission from the shelter.
#
# The shelter has a site but no animal catalogue on it, so there is nothing to
# crawl. It writes its animals straight into our portal instead: ingestion
# stays manual, no adapter is registered for it and the crawl loop skips it;
# the listings feed is where its animals come from and the removal guard, the
# image cache and the crawled snapshot treat them like any other crawled
# record. See docs/MANUAL-LISTINGS.md.
providerId: oskar
source: https://zavetisceoskar.si/
enabled: true

ingestion: manual
images: cache-permitted
descriptions: full-permitted

logo:
  use: permitted
  # The shelter's own mark, from its own site: the dog-and-cat heads forming a
  # heart, beside the "Zavetišče Oskar Vitovlje" wordmark. Transparent PNG.
  # 265x63 is the largest the site holds; a white knockout of the same lockup
  # sits at sites/all/themes/cms_subtheme/images/logo-footer.png if a dark
  # variant is ever wanted.
  url: https://zavetisceoskar.si/sites/default/files/logo.png
  date: 2026-08-30
  reference: project-owner-confirmation-logos-2026-08-30

permission:
  status: granted
  date: 2026-09-01
  reference: project-owner-confirmation-portal-listings-2026-09-01
  notes: >-
    The shelter lists its animals directly through the portal on Posvoji.si.
    Typing a listing in is publishing it, which is a stronger grant than a
    crawl permission: the photos are uploaded by the shelter for us to show,
    so they may be cached, and the text is written for this site, so
    descriptions carry in full. The project owner confirmed the listing
    permission on 2026-09-01. Nothing is taken from the site above; it is
    recorded as the shelter's home page, not as a catalogue.

    DATA-POLICY.md principle 3 asks every animal to link to the listing it
    came from. For a manual listing the original is the listing on Posvoji.si
    itself, so source.sourceUrl is the shelter's own page on this site rather
    than a page on the source above.

attribution: "Vir: Zavetišče Oskar Vitovlje"

crawl:
  intervalHours: 12
  excludePaths: []
