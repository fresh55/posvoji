# Machine-readable permission record. CI validates every policy.yaml against
# the ProviderPolicy schema: a provider cannot be enabled, show images or carry
# more than bare facts without granted, dated permission from the shelter.
#
# This one records a logo grant and nothing else. The shelter publishes no
# animal list we ingest, so enabled stays false and no adapter is registered
# for it: the crawl skips it entirely and only the logo sync reads this file.
providerId: oskar
source: https://zavetisceoskar.si/
enabled: false

ingestion: manual
images: none
descriptions: facts-only

logo:
  use: permitted
  # The shelter's own mark, from its own site: the dog-and-cat heads forming a
  # heart, beside the "Zavetišče Oskar Vitovlje" wordmark. Transparent PNG.
  # 265x63 is the largest the site holds; a white knockout of the same lockup
  # sits at sites/all/themes/cms_subtheme/images/logo-footer.png if a dark
  # variant is ever wanted.
  url: https://zavetisceoskar.si/sites/default/files/logo.png
  date: 2026-08-30
  reference: project-owner-confirmation-logos-2026-08-30

permission:
  status: granted
  date: 2026-08-30
  reference: project-owner-confirmation-logos-2026-08-30
  notes: >-
    Project owner confirmed permission to use this shelter's logo. The grant
    recorded here covers the mark only: no animal data is taken from this
    shelter, which is why enabled is false, images are none and descriptions
    stay facts-only.

attribution: "Vir: Zavetišče Oskar Vitovlje"

crawl:
  intervalHours: 12
  excludePaths: []
