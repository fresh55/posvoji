# Machine-readable permission record. CI validates every policy.yaml against
# the ProviderPolicy schema: a provider cannot be enabled, show images or carry
# more than bare facts without granted, dated permission from the shelter.
#
# This one records a logo grant and nothing else. The shelter publishes no
# animal list we ingest, so enabled stays false and no adapter is registered
# for it: the crawl skips it entirely and only the logo sync reads this file.
providerId: sevnica
source: https://veterina-sevnica.si/
enabled: false

ingestion: manual
images: none
descriptions: facts-only

logo:
  use: permitted
  # The veterinary practice's own emblem, not a shelter mark: the shelter is
  # run by Veterinarska postaja Sevnica and has no separate artwork. Chosen
  # deliberately by the project owner rather than arrived at by discovery.
  #
  # The site also publishes a cut-out copy of the same emblem
  # (2024/03/output-onlinepngtools.png) whose alpha peaks at 173 of 255, so
  # every pixel of it renders washed out. This one is flat white behind the
  # mark, which the site draws as a plate of its own.
  url: https://veterina-sevnica.si/wp-content/uploads/2024/02/Logo-V.P.-Sevnica.png
  date: 2026-08-30
  reference: project-owner-confirmation-logos-2026-08-30

permission:
  status: none
  notes: >-
    No animal-catalogue permission is recorded. The independently dated logo
    grant above covers the mark only; no animal data is taken from this shelter.

attribution: "Vir: Veterina Sevnica"

crawl:
  intervalHours: 12
  excludePaths: []
