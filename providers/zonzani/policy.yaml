# The project owner confirmed Zonzani's permission in writing on 2026-08-18,
# covering the dog and cat catalogues, the photographs and the descriptions.
# The parser does not extract descriptions yet, so none are ingested until it
# does; the policy records the grant, not the implementation.
providerId: zonzani
source: https://www.zonzani.si
enabled: true

ingestion: scrape
images: cache-permitted
descriptions: full-permitted

logo:
  use: permitted
  url: https://www.zonzani.si/wp-content/uploads/2023/01/zonzani_logo_web.png
  date: 2026-08-20
  reference: project-owner-confirmation-logos-2026-08-20

permission:
  status: granted
  date: 2026-08-18
  reference: project-owner-confirmation-zonzani-2026-08-18
  notes: >-
    Project owner confirmed permission for the Zonzani dog and cat catalogues,
    for displaying and caching the animal photographs, and for the full
    descriptions.

attribution: "Vir: Zavetišče Zonzani"

crawl:
  intervalHours: 12
  excludePaths: []
